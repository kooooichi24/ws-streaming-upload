service: ws-streaming-upload

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-northeast-1
  stage: ${opt:stage, 'dev'}
  websocketsApiName: ws-streaming-upload-${self:provider.stage}
  websocketsApiRouteSelectionExpression: $request.body.action
  environment:
    STAGE: ${self:provider.stage}
    SERVICE: ${self:service}
    CONNECTIONS_TABLE: ${self:service}-connections-${self:provider.stage}
    S3_BUCKET_NAME: ${self:service}-${self:provider.stage}
    IS_OFFLINE: ${env:IS_OFFLINE, 'false'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::${self:service}-${self:provider.stage}/*
        - Effect: Allow
          Action:
            - s3:ListBucket
          Resource:
            - arn:aws:s3:::${self:service}-${self:provider.stage}
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
            - dynamodb:GetItem
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-connections-${self:provider.stage}

plugins:
  - serverless-offline

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: 'node22'
    platform: 'node'
    format: 'cjs'

layers:
  ffmpeg:
    path: layers/ffmpeg
    name: ${self:service}-ffmpeg-${self:provider.stage}
    description: FFmpeg binary for audio/video processing
    compatibleRuntimes:
      - nodejs22.x
    retain: false

functions:
  connect:
    handler: src/handler.connect
    events:
      - websocket:
          route: $connect

  disconnect:
    handler: src/handler.disconnect
    layers:
      - { Ref: FfmpegLambdaLayer }
    timeout: 900
    memorySize: 1024
    events:
      - websocket:
          route: $disconnect

  default:
    handler: src/handler.default
    events:
      - websocket:
          route: $default

  sendMessage:
    handler: src/handler.sendMessage
    events:
      - websocket:
          route: sendMessage

  upload:
    handler: src/handler.upload
    events:
      - websocket:
          route: upload

resources:
  Resources:
    # DynamoDB table for connection management
    ConnectionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-connections-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: connectionId
            AttributeType: S
        KeySchema:
          - AttributeName: connectionId
            KeyType: HASH
        TimeToLiveSpecification:
          Enabled: true
          AttributeName: ttl
    # S3 bucket for file storage
    S3Bucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-${self:provider.stage}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        VersioningConfiguration:
          Status: Enabled

